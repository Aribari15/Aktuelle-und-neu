name: Build and publish Nuvio plugin
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Täglich 04:17 UTC: übernimmt Aktualisierungen am Provider-Code.
    - cron: "17 4 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate metadata
        run: node test.mjs
      - name: Build
        run: node build.mjs
      - name: Validate build
        run: node test.mjs --dist
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
